name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'HesnPrivateBrowser-project.zip'
      - '.github/workflows/build-apk-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: |
          mkdir project
          unzip -q HesnPrivateBrowser-project.zip -d project
      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -f project/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HesnPrivateBrowser-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
